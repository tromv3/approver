services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-approver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-approver}
      POSTGRES_DB: ${POSTGRES_DB:-approver}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не публикуется: бот ходит в БД по внутренней сети compose.
    # Для ручного доступа: docker compose exec db psql -U approver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-approver} -d ${POSTGRES_DB:-approver}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-approver}:${POSTGRES_PASSWORD:-approver}@db:5432/${POSTGRES_DB:-approver}
      LOCAL_TZ: ${LOCAL_TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "bot.health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-approver}
      PGPASSWORD: ${POSTGRES_PASSWORD:-approver}
      PGDATABASE: ${POSTGRES_DB:-approver}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    command: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
